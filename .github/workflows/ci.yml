name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode with iOS simulator runtime
        run: |
          set -euo pipefail
          candidates=$(ls -1 /Applications | grep -E '^Xcode.*\.app$' | sort -Vr || true)
          if [ -z "${candidates}" ]; then
            echo "No Xcode installations found under /Applications" >&2
            exit 1
          fi
          selected=""
          IFS=$'\n'
          for xcode in ${candidates}; do
            dev_dir="/Applications/${xcode}/Contents/Developer"
            xcodebuild_bin="${dev_dir}/usr/bin/xcodebuild"
            if [ ! -x "${xcodebuild_bin}" ]; then
              continue
            fi
            if ! DEVELOPER_DIR="${dev_dir}" "${xcodebuild_bin}" -showsdks | grep -q "iphonesimulator"; then
              echo "Skipping ${xcode} (iphonesimulator SDK not listed)"
              continue
            fi
            if ! DEVELOPER_DIR="${dev_dir}" /usr/bin/xcrun simctl list runtimes | grep -q "iOS .* (available)"; then
              echo "Skipping ${xcode} (no available iOS simulator runtime)"
              continue
            fi
            selected="${xcode}"
            break
          done
          unset IFS
          if [ -z "${selected}" ]; then
            echo "No Xcode bundle with an iOS simulator runtime was found." >&2
            exit 1
          fi
          sudo xcode-select -s "/Applications/${selected}/Contents/Developer"
          echo "Selected ${selected}"
          xcodebuild -version

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project my-traning-app/my-traning-app.xcodeproj

      - name: Show available simulators
        run: xcrun simctl list devices available

      - name: Pick available simulator
        run: |
          set -euo pipefail
          INFO=$(xcrun simctl list devices available | awk '
            /^-- iOS / { runtime=$0; sub(/^-- /,"",runtime); sub(/ --$/,"",runtime); next }
            /^[[:space:]]+iPhone/ && runtime != "" {
              name=$0
              sub(/^[[:space:]]+/,"",name)
              sub(/ \(.*$/,"",name)
              print runtime "||" name
              exit
            }')
          if [ -z "${INFO}" ]; then
            echo "No available iOS iPhone simulator found" >&2
            exit 1
          fi
          RUNTIME=${INFO%%||*}
          DEVICE_NAME=${INFO##*||}
          OS_VERSION=$(printf '%s\n' "${RUNTIME}" | sed -n 's/^iOS //p')
          if [ -z "${OS_VERSION}" ]; then
            OS_VERSION="latest"
          fi
          echo "Using simulator: ${DEVICE_NAME} (iOS ${OS_VERSION})"
          echo "DESTINATION=platform=iOS Simulator,OS=${OS_VERSION},name=${DEVICE_NAME}" >> "${GITHUB_ENV}"

      - name: Run unit tests with coverage
        run: |
          xcodebuild \
            -project my-traning-app/my-traning-app.xcodeproj \
            -scheme "my-traning-app" \
            -destination "${{ env.DESTINATION }}" \
            -enableCodeCoverage YES \
            clean test

      - name: Show coverage summary
        run: |
          RESULT_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name '*.xcresult' -print | head -n 1)
          if [ -n "$RESULT_PATH" ]; then
            xcrun xccov view --report "$RESULT_PATH"
          else
            echo "xcresult not found"
            exit 1
          fi
