name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Xcode 26 series
        run: |
          set -euo pipefail
          candidates=$(ls -1 /Applications | grep -E '^Xcode_26.*\.app$' | sort -Vr || true)
          if [ -z "${candidates}" ]; then
            echo "Xcode 26 series not found under /Applications" >&2
            ls -1 /Applications || true
            exit 1
          fi
          selected=$(echo "${candidates}" | head -n 1)
          path="/Applications/${selected}"
          echo "Using ${path}"
          {
            echo "XCODE_APP_PATH=${path}"
            echo "DEVELOPER_DIR=${path}/Contents/Developer"
          } >> "${GITHUB_ENV}"

      - name: Select desired Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s "${DEVELOPER_DIR}"
          echo "Selected ${XCODE_APP_PATH}"
          xcodebuild -version

      - name: Ensure iOS simulator runtime is installed
        run: |
          set -euo pipefail
          has_ios_runtime() {
            xcrun simctl list runtimes | grep -q "com\.apple\.CoreSimulator\.SimRuntime\.iOS"
          }
          if has_ios_runtime; then
            echo "An iOS simulator runtime is already available."
            exit 0
          fi
          echo "Downloading iOS simulator runtime for ${XCODE_APP_PATH}"
          sudo xcodebuild -downloadPlatform iOS
          if ! has_ios_runtime; then
            echo "iOS simulator runtime still missing after download. Listing runtimes:" >&2
            xcrun simctl list runtimes >&2
            echo "iOS simulator runtime still missing after download." >&2
            exit 1
          fi

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project my-traning-app/my-traning-app.xcodeproj

      - name: Show available runtimes
        run: xcrun simctl list runtimes

      - name: Show available simulators
        run: xcrun simctl list devices available

      - name: Determine test destination
        run: |
          set -euo pipefail
          DEVICES_OUTPUT=$(xcrun simctl list devices available)
          FRIENDLY=""
          DESTINATION=""
          FALLBACK=0

          if printf '%s\n' "${DEVICES_OUTPUT}" | grep -F "iPhone 16 Pro (18.4" >/dev/null; then
            DEVICE_NAME="iPhone 16 Pro"
            OS_VERSION="18.4"
            DESTINATION="platform=iOS Simulator,OS=${OS_VERSION},name=${DEVICE_NAME}"
            FRIENDLY="iOS Simulator ${DEVICE_NAME} (iOS ${OS_VERSION})"
          elif printf '%s\n' "${DEVICES_OUTPUT}" | grep -F "iPhone 15 Pro" >/dev/null; then
            DEVICE_NAME="iPhone 15 Pro"
            # Attempt to display the first available runtime version for friendliness only.
            OS_VERSION=$(printf '%s\n' "${DEVICES_OUTPUT}" | awk '
              /iPhone 15 Pro/ {
                if (match($0, /\(([0-9.]+)\)/, m)) {
                  print m[1]
                  exit
                }
              }')
            if [ -z "${OS_VERSION}" ]; then
              OS_VERSION="latest"
            fi
            DESTINATION="platform=iOS Simulator,OS=latest,name=${DEVICE_NAME}"
            FRIENDLY="iOS Simulator ${DEVICE_NAME} (iOS ${OS_VERSION})"
          else
            INFO=$(printf '%s\n' "${DEVICES_OUTPUT}" | awk '
              /^-- iOS / { runtime=$0; sub(/^-- /,"",runtime); sub(/ --$/,"",runtime); next }
              /^[[:space:]]+iPhone/ && runtime != "" {
                name=$0
                sub(/^[[:space:]]+/,"",name)
                sub(/ \(.*$/,"",name)
                print runtime "||" name
                exit
              }' || true)
            if [ -n "${INFO}" ]; then
              RUNTIME=${INFO%%||*}
              DEVICE_NAME=${INFO##*||}
              OS_VERSION=$(printf '%s\n' "${RUNTIME}" | sed -n 's/^iOS //p')
              if [ -z "${OS_VERSION}" ]; then
                OS_VERSION="latest"
              fi
              DESTINATION="platform=iOS Simulator,OS=${OS_VERSION},name=${DEVICE_NAME}"
              FRIENDLY="iOS Simulator ${DEVICE_NAME} (iOS ${OS_VERSION})"
            else
              echo "No iOS simulator runtime is available. Falling back to running tests on macOS." >&2
              DESTINATION="platform=macOS,arch=arm64"
              FRIENDLY="macOS (local runner)"
              FALLBACK=1
            fi
          fi
          if [ -z "${DESTINATION}" ]; then
            echo "Failed to determine a destination" >&2
            exit 1
          fi
          {
            printf 'DESTINATION=%s\n' "${DESTINATION}"
            printf 'DESTINATION_FRIENDLY=%s\n' "${FRIENDLY}"
            printf 'DESTINATION_FALLBACK_TO_MAC=%s\n' "${FALLBACK}"
          } >> "${GITHUB_ENV}"
          echo "Selected destination: ${FRIENDLY}"

      - name: Run unit tests with coverage
        run: |
          echo "Running tests on ${DESTINATION_FRIENDLY:-unknown destination}"
          if [ "${DESTINATION_FALLBACK_TO_MAC:-0}" = "1" ]; then
            echo "::notice title=Destination fallback::iOS simulator runtime was unavailable. Tests are running on macOS instead." >&2
          fi
          xcodebuild \
            -project my-traning-app/my-traning-app.xcodeproj \
            -scheme "my-traning-app" \
            -destination "${{ env.DESTINATION }}" \
            -enableCodeCoverage YES \
            clean test

      - name: Show coverage summary
        run: |
          RESULT_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name '*.xcresult' -print | head -n 1)
          if [ -n "$RESULT_PATH" ]; then
            xcrun xccov view --report "$RESULT_PATH"
          else
            echo "xcresult not found"
            exit 1
          fi
