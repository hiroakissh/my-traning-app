name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          sudo xcode-select -s "/Applications/Xcode.app/Contents/Developer"
          echo "Selected Xcode path: $(xcode-select -p)"
          xcodebuild -version

      - name: Detect iOS runtime
        id: detect_runtime
        run: |
          set -euo pipefail
          RUNTIME=$(xcrun simctl list devices available \
            | awk '/iPhone 17/ && /OS:/{ if (match($0, /OS:([0-9.]+)/, m)) { print m[1]; exit }}')
          if [ -z "${RUNTIME}" ]; then
            # Fallback: pick first iOS 26.x runtime version
            RUNTIME=$(xcrun simctl list runtimes \
              | sed -n 's/.*iOS \([0-9][0-9.]*\).*/\1/p' \
              | grep '^26\.' \
              | head -n1)
          fi
          if [ -z "${RUNTIME}" ]; then
            # Final fallback to a fixed, widely available runtime version on current runners.
            RUNTIME="26.0.1"
            echo "::warning title=Runtime fallback::Using fallback runtime version ${RUNTIME} because no matching iPhone 17 device or iOS 26.x runtime was detected."
          fi
          echo "runtime=${RUNTIME}" >> "${GITHUB_OUTPUT}"

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project my-traning-app/my-traning-app.xcodeproj

      - name: Show available runtimes
        run: xcrun simctl list runtimes

      - name: Show available simulators
        run: xcrun simctl list devices available

      - name: Run unit tests with coverage
        run: |
          RUNTIME_VERSION="${{ steps.detect_runtime.outputs.runtime }}"
          DEVICE_NAME="iPhone 17"
          echo "Running on simulator: ${DEVICE_NAME} (iOS ${RUNTIME_VERSION})"
          xcodebuild \
            -project my-traning-app/my-traning-app.xcodeproj \
            -scheme "my-traning-app" \
            -destination "platform=iOS Simulator,name=${DEVICE_NAME},OS=${RUNTIME_VERSION}" \
            -enableCodeCoverage YES \
            clean test

      - name: Show coverage summary
        run: |
          RESULT_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name '*.xcresult' -print | head -n 1)
          if [ -n "$RESULT_PATH" ]; then
            xcrun xccov view --report "$RESULT_PATH"
          else
            echo "xcresult not found"
            exit 1
          fi
