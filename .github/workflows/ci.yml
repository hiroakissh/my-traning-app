name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest available Xcode
        run: |
          set -euo pipefail
          latest_xcode=$(ls -1 /Applications | grep -E '^Xcode(_[0-9]+(\.[0-9]+)*)?\.app$' | sort -V | tail -n 1 || true)
          if [ -z "${latest_xcode}" ]; then
            latest_xcode="Xcode.app"
          fi
          sudo xcode-select -s "/Applications/${latest_xcode}/Contents/Developer"
          echo "Selected ${latest_xcode}"
          xcodebuild -version

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project my-traning-app/my-traning-app.xcodeproj

      - name: Show available simulators
        run: xcrun simctl list devices available

      - name: Pick available simulator
        run: |
          set -euo pipefail
          INFO=$(xcrun simctl list devices available | awk '
            /^-- iOS / { runtime=$0; sub(/^-- /,"",runtime); sub(/ --$/,"",runtime); next }
            /^[[:space:]]+iPhone/ && runtime != "" {
              name=$0
              sub(/^[[:space:]]+/,"",name)
              sub(/ \(.*$/,"",name)
              print runtime "||" name
              exit
            }')
          if [ -z "${INFO}" ]; then
            echo "No available iOS iPhone simulator found" >&2
            exit 1
          fi
          RUNTIME=${INFO%%||*}
          DEVICE_NAME=${INFO##*||}
          OS_VERSION=$(printf '%s\n' "${RUNTIME}" | sed -n 's/^iOS //p')
          if [ -z "${OS_VERSION}" ]; then
            OS_VERSION="latest"
          fi
          echo "Using simulator: ${DEVICE_NAME} (iOS ${OS_VERSION})"
          echo "DESTINATION=platform=iOS Simulator,OS=${OS_VERSION},name=${DEVICE_NAME}" >> "${GITHUB_ENV}"

      - name: Run unit tests with coverage
        run: |
          xcodebuild \
            -project my-traning-app/my-traning-app.xcodeproj \
            -scheme "my-traning-app" \
            -destination "${{ env.DESTINATION }}" \
            -enableCodeCoverage YES \
            clean test

      - name: Show coverage summary
        run: |
          RESULT_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name '*.xcresult' -print | head -n 1)
          if [ -n "$RESULT_PATH" ]; then
            xcrun xccov view --report "$RESULT_PATH"
          else
            echo "xcresult not found"
            exit 1
          fi
