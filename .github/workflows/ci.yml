name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer \
            || sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer \
            || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project my-traning-app/my-traning-app.xcodeproj

      - name: Run unit tests with coverage
        run: |
          xcodebuild \
            -project my-traning-app/my-traning-app.xcodeproj \
            -scheme "my-traning-app" \
            -destination 'platform=iOS Simulator,OS=17.5,name=iPhone 15' \
            -enableCodeCoverage YES \
            clean test

      - name: Show coverage summary
        run: |
          RESULT_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name '*.xcresult' -print | head -n 1)
          if [ -n "$RESULT_PATH" ]; then
            xcrun xccov view --report "$RESULT_PATH"
          else
            echo "xcresult not found"
            exit 1
          fi
