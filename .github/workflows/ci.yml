name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          sudo xcode-select -s "/Applications/Xcode.app/Contents/Developer"
          echo "Selected Xcode path: $(xcode-select -p)"
          xcodebuild -version

      - name: Detect iOS runtime
        id: detect_runtime
        run: |
          set -euo pipefail
          RUNTIME_26=$(xcrun simctl list runtimes | grep -E "iOS 26" || true)
          if [ -n "${RUNTIME_26}" ]; then
            echo "runtime=26.0" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          RUNTIME_25=$(xcrun simctl list runtimes | grep -E "iOS 25" || true)
          if [ -n "${RUNTIME_25}" ]; then
            echo "runtime=25.0" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "No iOS 26 / 25 runtime is available on this runner." >&2
          xcrun simctl list runtimes >&2
          exit 1

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project my-traning-app/my-traning-app.xcodeproj

      - name: Show available runtimes
        run: xcrun simctl list runtimes

      - name: Show available simulators
        run: xcrun simctl list devices available

      - name: Run unit tests with coverage
        run: |
          RUNTIME_VERSION="${{ steps.detect_runtime.outputs.runtime }}"
          DEVICE_NAME="iPhone 15"
          echo "Running on simulator: ${DEVICE_NAME} (iOS ${RUNTIME_VERSION})"
          xcodebuild \
            -project my-traning-app/my-traning-app.xcodeproj \
            -scheme "my-traning-app" \
            -destination "platform=iOS Simulator,name=${DEVICE_NAME},OS=${RUNTIME_VERSION}" \
            -enableCodeCoverage YES \
            clean test

      - name: Show coverage summary
        run: |
          RESULT_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name '*.xcresult' -print | head -n 1)
          if [ -n "$RESULT_PATH" ]; then
            xcrun xccov view --report "$RESULT_PATH"
          else
            echo "xcresult not found"
            exit 1
          fi
