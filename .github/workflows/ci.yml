name: CI

on:
  push:
    branches:
      - main
      - feature/**
      - bugfix/**
      - hotfix/**
      - release/**
      - '*'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          sudo xcode-select -s "/Applications/Xcode.app/Contents/Developer"
          echo "Selected Xcode path: $(xcode-select -p)"
          xcodebuild -version

      - name: Detect iOS runtime
        id: detect_runtime
        run: |
          set -euo pipefail
          python - <<'PY'
import json, os, subprocess, sys

def version_tuple(v: str):
    try:
        return tuple(int(p) for p in v.split('.'))
    except Exception:
        return ()

raw = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"], text=True)
data = json.loads(raw)

preferred = []
fallback_26 = []
any_ios = []

for runtime, devices in data.get("devices", {}).items():
    if "com.apple.CoreSimulator.SimRuntime.iOS" not in runtime:
        continue
    ver = runtime.rsplit('.', 1)[-1].replace('-', '.')
    vtuple = version_tuple(ver)
    for dev in devices:
        if not dev.get("isAvailable"):
            continue
        name = dev.get("name", "")
        entry = (vtuple, ver, name)
        if name.startswith("iPhone 17"):
            preferred.append(entry)
        if ver.startswith("26."):
            fallback_26.append(entry)
        any_ios.append(entry)

def pick_best(entries):
    if not entries:
        return None
    # sort by version tuple descending, then name for stability
    return sorted(entries, key=lambda x: (x[0], x[2]), reverse=True)[0]

chosen = pick_best(preferred) or pick_best(fallback_26) or pick_best(any_ios)
if not chosen:
    print("::error title=Runtime detection failed::No available iOS simulators found.", file=sys.stderr)
    sys.exit(1)

version, version_str, name = chosen
print(f"runtime={version_str}")
print(f"device_name={name}")
PY

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project my-traning-app/my-traning-app.xcodeproj

      - name: Show available runtimes
        run: xcrun simctl list runtimes

      - name: Show available simulators
        run: xcrun simctl list devices available

      - name: Run unit tests with coverage
        run: |
          RUNTIME_VERSION="${{ steps.detect_runtime.outputs.runtime }}"
          DEVICE_NAME="${{ steps.detect_runtime.outputs.device_name }}"
          echo "Running on simulator: ${DEVICE_NAME} (iOS ${RUNTIME_VERSION})"
          xcodebuild \
            -project my-traning-app/my-traning-app.xcodeproj \
            -scheme "my-traning-app" \
            -destination "platform=iOS Simulator,name=${DEVICE_NAME},OS=${RUNTIME_VERSION}" \
            -enableCodeCoverage YES \
            clean test

      - name: Show coverage summary
        run: |
          RESULT_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name '*.xcresult' -print | head -n 1)
          if [ -n "$RESULT_PATH" ]; then
            xcrun xccov view --report "$RESULT_PATH"
          else
            echo "xcresult not found"
            exit 1
          fi
